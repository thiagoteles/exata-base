# The checks that run before a change is accepted. This workflow is present and turned off: the only
# trigger is a manual run. To turn it on, replace `workflow_dispatch` with the triggers you want:
#
#   on:
#     push: { branches: [main] }
#     pull_request:

name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The integration tests start their own Postgres through Docker, which the runner provides.
      - run: pnpm test:integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image must build with no variable and no secret.
      - run: docker build --tag product:ci .
