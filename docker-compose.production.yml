# Production on Coolify (or any Docker host). Every value below is read when the container starts,
# except Clerk's publishable key, which is public and is given to the build (in Coolify, mark it as
# a build variable); leave it empty for local sign-in. The database runs beside the app, in this
# stack, on a volume of its own; the app reaches it by the service name. Back it up from the
# stack's Postgres in Coolify, which offers a scheduled backup for it. Coolify's proxy owns the
# public port and the certificate, so nothing is published, the database included.
# Set the variables in Coolify's panel, not in this file. The README says what each one does.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      APP_URL: ${APP_URL:?Set APP_URL to the public address of the product}
      # Letters and digits only in the password: it goes inside this address unescaped.
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/app
      AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-traefik}
      ACCESS_LOG: ${ACCESS_LOG:-off}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN:-}
      MAILTRAP_INBOX: ${MAILTRAP_INBOX:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      DOCUMENT_SECRET: ${DOCUMENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GCP_CREDENTIALS: ${GCP_CREDENTIALS:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # Coolify fills SOURCE_COMMIT with the deployed commit; errors are grouped per version.
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      SERVICE_NAME: ${SERVICE_NAME:-app}
      STORAGE_DIR: /data/files
      FILE_URL_SECRET: ${FILE_URL_SECRET:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      EMAIL_ATTACHMENTS_MAX_MB: ${EMAIL_ATTACHMENTS_MAX_MB:-10}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Files live here when there is no Cloud Storage bucket.
      - app-files:/data/files

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  app-files:
  postgres-data:
